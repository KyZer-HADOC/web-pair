<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KyZer-Fea · Session Pairing</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0f0d;
        --bg-soft: #0f1512;
        --card: #121a17;
        --card-2: #16201c;
        --line: rgba(232, 240, 237, 0.08);
        --line-strong: rgba(232, 240, 237, 0.16);
        --text: #e8f0ed;
        --muted: #8ea299;
        --mint: #6ee7b7;
        --mint-dim: #3fae87;
        --amber: #f4b860;
        --danger: #f2726b;
        --font-display: "Sora", sans-serif;
        --font-body: "Inter", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
        }
      }

      body {
        font-family: var(--font-body);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
      }

      /* ambient signal grid backdrop */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image: radial-gradient(
            circle at 20% 20%,
            rgba(110, 231, 183, 0.07),
            transparent 40%
          ),
          radial-gradient(
            circle at 85% 75%,
            rgba(244, 184, 96, 0.05),
            transparent 45%
          ),
          linear-gradient(
            var(--line) 1px,
            transparent 1px
          ),
          linear-gradient(90deg, var(--line) 1px, transparent 1px);
        background-size: auto, auto, 42px 42px, 42px 42px;
        opacity: 0.6;
        pointer-events: none;
        z-index: 0;
      }

      .container {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(180deg, var(--card), var(--card-2));
        border-radius: 20px;
        padding: 32px 28px 26px;
        border: 1px solid var(--line);
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.03);
        position: relative;
        z-index: 1;
      }

      /* ---------- header / signature signal-lock element ---------- */
      .header {
        text-align: center;
        margin-bottom: 26px;
      }

      .signal {
        position: relative;
        width: 92px;
        height: 92px;
        margin: 0 auto 18px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .signal-ring {
        position: absolute;
        border-radius: 50%;
        border: 1px solid var(--mint-dim);
        opacity: 0;
        animation: ping 2.8s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
      }
      .signal-ring:nth-child(1) {
        inset: 0;
        animation-delay: 0s;
      }
      .signal-ring:nth-child(2) {
        inset: 0;
        animation-delay: 0.9s;
      }
      .signal-ring:nth-child(3) {
        inset: 0;
        animation-delay: 1.8s;
      }

      @keyframes ping {
        0% {
          transform: scale(0.55);
          opacity: 0.55;
        }
        80% {
          opacity: 0;
        }
        100% {
          transform: scale(1.35);
          opacity: 0;
        }
      }

      .signal-core {
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 28%, #1c2925, #0c1210);
        border: 1px solid var(--line-strong);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: var(--mint);
        box-shadow: 0 0 0 4px rgba(110, 231, 183, 0.06),
          0 4px 18px rgba(0, 0, 0, 0.5);
        z-index: 1;
      }

      .title {
        font-family: var(--font-display);
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 0.2px;
        margin-bottom: 6px;
      }

      .title .accent {
        color: var(--mint);
      }

      .subtitle {
        font-family: var(--font-mono);
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.4px;
      }

      .subtitle .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--mint);
        margin-right: 7px;
        box-shadow: 0 0 8px var(--mint);
        animation: blink 1.6s ease-in-out infinite;
      }

      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.25;
        }
      }

      /* ---------- mode toggle ---------- */
      .toggle-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        background: rgba(0, 0, 0, 0.25);
        border-radius: 12px;
        padding: 4px;
        border: 1px solid var(--line);
      }

      .toggle-option {
        flex: 1;
        padding: 10px 16px;
        text-align: center;
        cursor: pointer;
        border-radius: 9px;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 0.2px;
        transition: all 0.25s ease;
        color: var(--muted);
      }

      .toggle-option.active {
        background: var(--mint);
        color: #05130f;
      }

      .toggle-option:hover:not(.active) {
        color: var(--text);
      }

      /* ---------- inputs / buttons ---------- */
      .input-group {
        margin-bottom: 18px;
        transition: all 0.3s ease;
      }

      .input-group.hidden {
        display: none;
      }

      .input-label {
        display: block;
        margin-bottom: 8px;
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.2px;
      }

      .input-field {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: rgba(0, 0, 0, 0.28);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 14.5px;
        letter-spacing: 0.3px;
      }

      .input-field::placeholder {
        color: rgba(142, 162, 153, 0.55);
      }

      .input-field:focus {
        outline: none;
        border-color: var(--mint);
        box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.14);
      }

      .generate-btn {
        width: 100%;
        padding: 13px;
        background: var(--mint);
        border: none;
        border-radius: 12px;
        color: #05130f;
        font-family: var(--font-body);
        font-size: 14.5px;
        font-weight: 700;
        letter-spacing: 0.2px;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        margin-bottom: 16px;
      }

      .generate-btn:hover {
        filter: brightness(1.06);
        transform: translateY(-1px);
        box-shadow: 0 10px 24px -8px rgba(110, 231, 183, 0.45);
      }

      .generate-btn:focus-visible,
      .toggle-option:focus-visible,
      .input-field:focus-visible,
      .copy-btn:focus-visible {
        outline: 2px solid var(--mint);
        outline-offset: 2px;
      }

      .generate-btn.hidden {
        display: none;
      }

      /* ---------- loading ---------- */
      .loading {
        display: none;
        text-align: center;
        margin: 4px 0 16px;
      }

      .loading i {
        font-size: 20px;
        color: var(--mint);
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        100% {
          transform: rotate(360deg);
        }
      }

      /* ---------- terminal-style code readout (signature element) ---------- */
      .code-display {
        background: #060a08;
        padding: 16px 14px;
        border-radius: 12px;
        text-align: left;
        font-family: var(--font-mono);
        font-size: 14px;
        margin-bottom: 16px;
        min-height: 48px;
        display: flex;
        align-items: center;
        border: 1px solid var(--line);
        color: var(--muted);
        position: relative;
      }

      .code-display::before {
        content: ">";
        color: var(--mint-dim);
        margin-right: 10px;
        flex-shrink: 0;
      }

      .code-display .cursor {
        display: inline-block;
        width: 7px;
        height: 15px;
        background: var(--mint);
        margin-left: 6px;
        animation: blink 1s step-start infinite;
        vertical-align: middle;
      }

      .qr-display {
        background: #060a08;
        padding: 26px;
        border-radius: 12px;
        text-align: center;
        margin-bottom: 16px;
        border: 1px solid var(--line);
        display: none;
      }

      .qr-image {
        max-width: 260px;
        max-height: 260px;
        width: 100%;
        margin: 0 auto 16px;
        border-radius: 10px;
        background: #fff;
        padding: 10px;
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.6);
      }

      .qr-instructions {
        font-family: var(--font-mono);
        font-size: 12px;
        color: var(--muted);
        line-height: 1.6;
      }

      .success-message {
        color: var(--mint);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .error-message {
        color: var(--danger);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }

      .copy-btn {
        width: 100%;
        padding: 12px;
        background: transparent;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        color: var(--text);
        font-size: 13.5px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: border-color 0.2s ease, background 0.2s ease;
      }

      .copy-btn:hover {
        border-color: var(--mint);
        background: rgba(110, 231, 183, 0.06);
      }

      .footer {
        text-align: center;
        margin-top: 22px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: rgba(142, 162, 153, 0.55);
        letter-spacing: 0.3px;
      }

      @media (max-width: 480px) {
        .container {
          padding: 26px 20px 22px;
          border-radius: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="signal">
          <div class="signal-ring"></div>
          <div class="signal-ring"></div>
          <div class="signal-ring"></div>
          <div class="signal-core"><i class="fas fa-bolt"></i></div>
        </div>
        <h1 class="title">KyZer<span class="accent">-Fea</span></h1>
        <p class="subtitle"><span class="dot"></span>awaiting device handshake</p>
      </div>

      <!-- Toggle Switch -->
      <div class="toggle-container" role="tablist" aria-label="Pairing method">
        <div class="toggle-option active" data-mode="pair" role="tab" aria-selected="true" tabindex="0">
          <i class="fas fa-key"></i> Pair Code
        </div>
        <div class="toggle-option" data-mode="qr" role="tab" aria-selected="false" tabindex="0">
          <i class="fas fa-qrcode"></i> QR Code
        </div>
      </div>

      <div class="input-group" id="inputGroup">
        <label class="input-label" for="mobileNumber"
          >WhatsApp number, with country code</label
        >
        <input
          type="text"
          id="mobileNumber"
          class="input-field"
          placeholder="+94774915917"
          pattern="[+][0-9]{10,}"
          title="Please enter country code starting with + followed by number"
        />
      </div>

      <button class="generate-btn" id="submit">
        <i class="fas fa-key"></i> Generate Pair Code
      </button>

      <div class="loading" id="loading">
        <i class="fas fa-spinner"></i>
      </div>

      <div class="code-display" id="codeDisplay">
        waiting for input<span class="cursor"></span>
      </div>

      <div class="qr-display" id="qrDisplay">
        <img id="qrImage" class="qr-image" src="" alt="QR Code" />
        <div class="qr-instructions" id="qrInstructions">
          Scan this QR code with your WhatsApp app
        </div>
      </div>

      <button class="copy-btn" id="copy" onclick="copyCode()">
        <i class="fas fa-copy"></i> Copy Code
      </button>

      <div class="footer">
        <p>© 2025 KyZer-Fea. All rights reserved.</p>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
    <script>
      let currentMode = "pair";

      // Toggle functionality
      document.querySelectorAll(".toggle-option").forEach((option) => {
        option.addEventListener("click", function () {
          activateMode(this);
        });
        option.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            activateMode(this);
          }
        });
      });

      function activateMode(el) {
        const mode = el.dataset.mode;
        if (mode === currentMode) return;

        document.querySelectorAll(".toggle-option").forEach((opt) => {
          opt.classList.remove("active");
          opt.setAttribute("aria-selected", "false");
        });
        el.classList.add("active");
        el.setAttribute("aria-selected", "true");

        currentMode = mode;

        const submitBtn = document.getElementById("submit");
        const inputGroup = document.getElementById("inputGroup");

        if (mode === "pair") {
          submitBtn.innerHTML = '<i class="fas fa-key"></i> Generate Pair Code';
          submitBtn.classList.remove("hidden");
          inputGroup.classList.remove("hidden");
        } else {
          submitBtn.classList.add("hidden");
          inputGroup.classList.add("hidden");
          generateQRCode();
        }

        document.getElementById("codeDisplay").innerHTML =
          'waiting for input<span class="cursor"></span>';
        document.getElementById("qrDisplay").style.display = "none";
        document.getElementById("codeDisplay").style.display = "flex";
      }

      async function generateQRCode() {
        const codeDisplay = document.getElementById("codeDisplay");
        const qrDisplay = document.getElementById("qrDisplay");
        const loadingSpinner = document.getElementById("loading");

        loadingSpinner.style.display = "block";
        codeDisplay.innerHTML = "";
        qrDisplay.style.display = "none";

        try {
          const response = await axios("/qr");

          if (response.data.qr) {
            document.getElementById("qrImage").src = response.data.qr;
            document.getElementById("qrInstructions").innerHTML =
              response.data.instructions.join("<br>");
            qrDisplay.style.display = "block";
            codeDisplay.style.display = "none";
          } else {
            codeDisplay.innerHTML =
              '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Failed to generate QR code</div>';
            codeDisplay.style.display = "flex";
          }
        } catch (error) {
          console.error("Error generating QR code:", error);
          codeDisplay.innerHTML =
            '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating QR code. Please try again.</div>';
          codeDisplay.style.display = "flex";
        } finally {
          loadingSpinner.style.display = "none";
        }
      }

      document.getElementById("submit").addEventListener("click", async (e) => {
        e.preventDefault();

        const mobileNumberInput = document.getElementById("mobileNumber");
        const codeDisplay = document.getElementById("codeDisplay");
        const qrDisplay = document.getElementById("qrDisplay");
        const loadingSpinner = document.getElementById("loading");

        const mobileNumber = mobileNumberInput.value.trim();
        if (!mobileNumber) {
          codeDisplay.innerHTML =
            '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Please enter your WhatsApp number</div>';
          codeDisplay.style.display = "flex";
          return;
        }

        loadingSpinner.style.display = "block";
        codeDisplay.innerHTML = "";
        qrDisplay.style.display = "none";

        try {
          const response = await axios(
            `/pair?number=${mobileNumber.replace(/[^0-9]/g, "")}`,
          );

          const code = response.data.code || "Service Unavailable";
          if (code === "Service Unavailable") {
            codeDisplay.innerHTML =
              '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Service Unavailable</div>';
          } else {
            codeDisplay.innerHTML = `<div class="success-message"><i class="fas fa-check-circle"></i> CODE: ${code}</div>`;
          }
          codeDisplay.style.display = "flex";
        } catch (error) {
          console.error("Error generating code:", error);
          codeDisplay.innerHTML =
            '<div class="error-message"><i class="fas fa-exclamation-circle"></i> Error generating code. Please try again.</div>';
          codeDisplay.style.display = "flex";
        } finally {
          loadingSpinner.style.display = "none";
        }
      });

      function copyCode() {
        const codeDisplay = document.getElementById("codeDisplay").innerText;
        const code = codeDisplay.replace("CODE: ", "").trim();
        navigator.clipboard
          .writeText(code)
          .then(() => {
            const copyBtn = document.getElementById("copy");
            const originalText = copyBtn.innerHTML;
            copyBtn.innerHTML = '<i class="fas fa-check"></i> Copied!';
            setTimeout(() => {
              copyBtn.innerHTML = originalText;
            }, 2000);
          })
          .catch((err) => {
            console.error("Failed to copy text: ", err);
          });
      }
    </script>
  </body>
</html>
